name: Anser SLA sweep

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar varredura de SLA
        run: |
          curl -sf "https://agente-ai-platform.vercel.app/api/debug/anser/sweep-sla" \
            -H "Authorization: Bearer ${{ secrets.ANSER_DEBUG_SECRET }}"
